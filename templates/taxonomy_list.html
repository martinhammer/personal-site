{# /tags/: every tag, with how many posts use it. #}
{% extends "base.html" %}

{% block title %}Tags · {{ config.title }}{% endblock %}

{% block content %}
  <h1>Tags</h1>
  <ul class="tag-cloud">
    {% for term in terms %}
    <li><a href="{{ term.permalink }}">{{ term.name }}</a> <span class="muted">{{ term.pages | length }}</span></li>
    {% endfor %}
  </ul>
{% endblock %}
